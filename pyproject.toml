[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skillscope"
version = "0.1.0"
description = "Reproducible analysis of selected IT vacancies in Central Asia"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SkillScope contributors" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mypy>=1.17",
  "pytest>=8.4",
  "ruff>=0.12",
]
[project.scripts]
skillscope-audit = "skillscope.audit:main"
skillscope-auth = "skillscope.auth:main"
skillscope-collect = "skillscope.collect:main"
skillscope-build-demo = "skillscope.demo_data:main"
skillscope-serve = "skillscope.serve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skillscope = [
  "demo_vacancies.jsonl",
  "role_catalog.toml",
  "static/index.html",
  "static/assets/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["skillscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
